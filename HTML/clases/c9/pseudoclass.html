        <section id="Hover">
            <section class="p-hover">

                <p class="h-size">No solo sirve para cambiar el color</p>

            </section>

        <section id="Focus">
            <h2>Ejemplos de focus</h2>
            <form class="f-form" action="post">
                <label for="text">Ingrese su nombre</label>
                <input type="text" required placeholder="su nombre">

                <label for="email">Ingrese su correo</label>
                <input type="email" required placeholder="su correo">

                <label for="pass">Ingrese su contraseña</label>
                <input type="password" required placeholder="su superclave">

                <p>focus en botones</p>
                <button value="Enviar">Enviar</button>
            </form>
        </section>
        <section id="Active">
            <h2>Ejemplos de active</h2>
            <button>btn activado</button>
            <div class="card">Tarjeta clickeable</div>
        </section>
